name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ragline.cli evaluate --min-recall 1.0 --min-mrr 0.9 --min-grounded 1.0
      - run: bash examples/demo.sh
      - run: python tools/build_postings.py --check

  postings-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_postings_browser.cjs tests/test_postings_chrome.cjs
      - run: bash tools/postings_wheel_smoke.sh
